[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgepulse"
version = "0.2.0"
description = "Portable PR triage, CI routing records, blast-radius, and policy for GitHub. Durable SQLite or Cloudflare D1 workspaces."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kevin Fairley" }]
keywords = ["github", "pull-requests", "ci", "policy", "triage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.8,<3",
  "pyyaml>=6.0,<7",
  "cryptography>=43,<47",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "httpx>=0.27",
  "types-PyYAML>=6.0",
]

[project.scripts]
forgepulse = "forgepulse.__main__:main"

[project.urls]
Homepage = "https://github.com/kfairley9999/forgepulse"
Issues = "https://github.com/kfairley9999/forgepulse/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forgepulse = ["py.typed", "data/*.yaml", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.coverage.run]
branch = true
source = ["forgepulse"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"src/forgepulse/sqlite_store.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["forgepulse"]
warn_unused_ignores = true
